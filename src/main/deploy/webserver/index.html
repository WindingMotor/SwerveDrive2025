<!DOCTYPE html>
<html>
<head>
    <title>Reef 3D Viewer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="status-bar">
        <div class="connection-indicator">
            <div class="indicator-dot"></div>
            <span class="indicator-text">Connected</span>
        </div>
        <div class="command-indicator">
            <span>Last Command: </span>
            <span id="last-command">None</span>
        </div>
    </div>
    <div id="scene-container"></div>

    <!-- Local library files -->
    <script src="libs/three.min.js"></script>
    <script src="libs/OrbitControls.js"></script>
    <script src="libs/GLTFLoader.js"></script>
    <script src="script.js"></script>
    <div id="tooltip" style="position: absolute; display: none; background-color: rgba(0,0,0,0.7); color: white; padding: 5px; border-radius: 3px;"></div>

</body>
</html>
